<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Story Engine</title>
  <link rel="stylesheet" href="style.css">
  <!-- Phaser 3 engine (CDN — Phase 1 prototype stage) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
</head>
<body>
  <!-- Game canvas layer -->
  <div id="game-container"></div>

  <!-- Ambient zone caption (Phase 5 — fades in/out on Dark Zone enter/exit) -->
  <div id="zone-text" class="hidden"></div>

  <!-- DOM modal overlay (Phase 6 — Option 1 style, popIn animation) -->
  <div id="ui-layer" class="hidden">
    <div class="modal">
      <span id="close-btn" class="close">&times;</span>
      <span id="modal-date" class="date"></span>
      <h2 id="modal-title"></h2>
      <img id="modal-img" src="" alt="Life event" style="display:none;">
      <p id="modal-text"></p>
      <button id="continue-btn">Continue Journey</button>
    </div>
  </div>

  <!-- Intro title card (Phase 8) -->
  <div id="title-card">
    <h1 id="title-heading">My Life Story</h1>
    <p id="title-sub">Use the arrow keys to walk, Up/Space to jump.</p>
    <button id="start-btn">Begin ▶</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
