<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biografía Interactiva</title>
    <link rel="stylesheet" href="style.css">
    <!-- Motor de Juego Phaser 3 desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
</head>
<body>
    <!-- Capa del Motor de Juego -->
    <div id="game-container"></div>
    
    <!-- Texto de Zona Ambiental (Ej: COVID) -->
    <div id="zone-text" class="hidden"></div>

    <!-- Capa de Interfaz Web (Modales Interactivos) -->
    <div id="ui-layer" class="hidden">
        <div class="modal">
            <span id="close-btn" class="close">&times;</span>
            <span id="modal-date" class="date"></span>
            <h2 id="modal-title"></h2>
            <img id="modal-img" src="" alt="Evento de vida" style="display:none;">
            <p id="modal-text"></p>
            <button id="continue-btn">Continuar Viaje</button>
        </div>
    </div>

    <!-- Scripts locales -->
    <script src="game.js"></script>
</body>
</html>
